[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tamarket"
version = "0.1.0"
description = "Temporary accommodation market picture for England, built from aggregate MHCLG statistics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Code: no licence chosen yet (see docs/decision_log.md). Data: Open Government Licence v3.0 (see data/SOURCES.md)." }
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "odfpy>=1.4",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional faster spreadsheet reader. Use with TAMARKET_EXCEL_ENGINE=calamine.
fast = ["python-calamine>=0.2"]

[tool.setuptools]
packages = ["tamarket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
